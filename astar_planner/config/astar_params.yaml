astar_planner:
  ros__parameters:
    # ── Алгоритм A* ────────────────────────────────────────────────────────────
    grid_resolution: 0.5          # метров на ячейку (должно совпадать с разрешением costmap)
    heuristic_weight: 1.0         # 1.0 = оптимальный A*; >1.0 = быстрее, но неоптимально
    max_iterations: 10000         # жёсткое ограничение на раскрытие узлов
    diagonal_movement: true        # 8-связная сетка (разрешает диагональные перемещения)
    cost_penalty_factor: 15.0     # больше → путь дальше от препятствий

    # ── Интерфейс costmap ───────────────────────────────────────────────────────
    lethal_cost_threshold: 70     # ячейки >= этого значения непроходимы (должно совпадать
                                  # с costmap_lethal_cost в integrated_system.yaml)
    unknown_cell_cost: 70         # стоимость, назначаемая неизвестным (-1) ячейкам

    # ── Перепланирование ────────────────────────────────────────────────────────
    planning_frequency: 2.0       # Гц — как часто планировщик проверяет необходимость перепланирования
    path_deviation_threshold_m: 5.0  # запуск перепланирования при отклонении БПЛА от пути на это расстояние

    # ── Обработка цели ──────────────────────────────────────────────────────────
    goal_tolerance_m: 3.0         # радиус приёма цели (метры)

    # ── Полётные ограничения БПЛА (размах крыла 15 футов) ───────────────────────
    safety_margin: 3.0            # минимальный зазор от препятствий (метры)
    min_altitude_m: 5.0           # минимальная высота AGL (метры)
    max_altitude_m: 120.0         # максимальная высота AGL (метры)
