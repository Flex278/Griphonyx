obstacle_detector:
  ros__parameters:
    # ── Зона обнаружения (БПЛА с размахом крыла 15 футов) ─────────────────
    danger_distance: 80.0     # Дальность обнаружения (метры)
    detection_width: 9.0      # Горизонтальное обнаружение ±Y (метры) — 15 футов размах + 3 м запас/сторона
    detection_height: 6.0     # Вертикальное обнаружение ±Z (метры)
    min_distance: 2.0         # Игнорировать точки ближе этого расстояния (метры)
    obstacle_inflation: 3.0   # Запас безопасности, применяемый ко всем расстояниям (метры)

    # ── Конфигурация топиков ──────────────────────────────────────────────
    lidar_topic: "/lidar/points"

    # ── Производительность ─────────────────────────────────────────────────
    update_rate: 10.0         # Частота обработки (Гц)

    # ── Отслеживание Калманом ─────────────────────────────────────────────
    kalman_dt: 0.1            # Шаг времени фильтра (с) — должен совпадать с 1/update_rate
    max_track_age: 5          # Кадров до удаления устаревшего трека
    min_track_hits: 2         # Обнаружений до подтверждения трека
    association_dist: 5.0     # Макс. расстояние (м) для привязки обнаружения к треку

    # ── Кластеризация (DBSCAN-lite) ───────────────────────────────────────
    cluster_eps: 2.0          # Радиус окрестности (метры)
    cluster_min_pts: 3        # Минимальное количество точек для формирования кластера

    # ── Пороги зонного обхода ────────────────────────────────────────────
    #   Зона 1 КРИТИЧЕСКАЯ  0 – zone_critical_m  → EMERGENCY_HOVER
    #   Зона 2 ОПАСНАЯ      zone_critical – zone_danger  → HARD_AVOID
    #   Зона 3 ПРЕДУПРЕЖДЕНИЕ zone_danger – zone_warning  → REROUTE
    #   Зона 4 ОСТОРОЖНО    zone_warning – zone_caution  → ADJUST_HEADING
    #   Зона 5 БЕЗОПАСНО    zone_caution – ∞             → NORMAL_FLIGHT
    zone_critical_m: 1.0
    zone_danger_m:   3.0
    zone_warning_m:  6.0
    zone_caution_m: 10.0
