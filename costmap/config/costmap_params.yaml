costmap_node:
  ros__parameters:
    # ── Размеры сетки ──────────────────────────────────────────────────────
    grid_size_m: 60.0         # Длина стороны costmap (метры) — с центром на БПЛА
    resolution: 0.5           # Метров на ячейку (меньше = точнее, больше вычислений)

    # ── Модель инфляции ────────────────────────────────────────────────────
    obstacle_clearance: 3.0   # Базовая сигма Гауссианы (метры)
    max_cost: 100             # Потолок летальной стоимости

    # ── Проекция динамических препятствий ──────────────────────────────────
    velocity_horizon: 3.0     # Секунды для проекции движущегося препятствия вперёд

    # ── Производительность ─────────────────────────────────────────────────
    publish_rate: 2.0         # Фоновая частота публикации (Гц)

    # ── Топики ─────────────────────────────────────────────────────────────
    lidar_topic: "/lidar/points"

    # ── Масштабирование сигмы инфляции по зонам обхода ────────────────────
    #   Зона             sigma = obstacle_clearance * scale
    #   EMERGENCY_HOVER  1.0×  (самая плотная инфляция — огибает препятствия)
    #   HARD_AVOID       1.0×
    #   REROUTE          1.5×
    #   ADJUST_HEADING   2.0×  (самая широкая инфляция — мягкая коррекция курса)
    #   NORMAL_FLIGHT    2.0×
    #
    # Эти масштабы скомпилированы в ноду; измените ZONE_SIGMA_SCALE в
    # costmap_node.py, если нужны другие значения.
